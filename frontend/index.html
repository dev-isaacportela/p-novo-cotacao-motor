<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#156b16" />
    <!-- Tema antes do React montar (design.md §2.1): sem isto a tela pisca
         clara e depois escurece. Mesma chave e mesma regra de src/lib/theme.ts.
         O Painel Benenutri abre o sistema com ?tema=dark|light: vale como
         preferência e é gravado aqui. Na primeira carga dentro do iframe a
         origem do painel vai para sessionStorage (o referrer se perde ao
         navegar); src/lib/theme.ts lê de lá para escutar e avisar o painel. -->
    <script>
      (function () {
        try {
          var daUrl = new URLSearchParams(location.search).get('tema');
          if (daUrl === 'dark' || daUrl === 'light') localStorage.setItem('theme', daUrl);
          var t = localStorage.getItem('theme');
          var escuro = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (escuro) document.documentElement.classList.add('dark');
          if (window.parent !== window && document.referrer && !sessionStorage.getItem('painel-origem')) {
            sessionStorage.setItem('painel-origem', new URL(document.referrer).origin);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap"
    />
    <title>Motor de Cotações</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
